<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense System</title>
    <script>
      // Applies the persisted theme before first paint so reloading on a
      // non-default theme doesn't flash the default one first. Keep the
      // storage key and valid ids in sync with src/hooks/useTheme.ts.
      (function () {
        var validThemes = ["default", "wavez", "modern-dolch", "bento"];
        var stored = localStorage.getItem("expense-tracker-theme");
        if (validThemes.indexOf(stored) !== -1) {
          document.documentElement.setAttribute("data-theme", stored);
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        font-weight: 400;
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
